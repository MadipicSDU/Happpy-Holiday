services:
  db:
    image: postgres:15-alpine
    container_name: happyholiday-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: HappyHoliday
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HappyHoliday"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: happyholiday-api
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=HappyHoliday;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY to at least 32 characters}
    ports:
      - "5294:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: happyholiday-ui
    ports:
      - "3000:3000"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: happyholiday-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@happyholiday.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
